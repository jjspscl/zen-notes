name: CI

on:
  push:
    branches: [main, beta, "feat/**"]
  pull_request:
    branches: [main, beta]

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Lint, validate and test
        run: npm run check
      - name: Release package contains only runtime files
        run: |
          npm run build
          unzip -Z1 zen-notes-*.zip | tee /tmp/zip-list
          ! grep -E '(^|/)(test|dev|scripts|node_modules|docs)/' /tmp/zip-list
          grep -q 'src/zen-notes-ui.uc.js' /tmp/zip-list
